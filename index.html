<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue des formations commercialisées</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-content">
        <div class="header-brand">
          <img
            class="header-logo"
            src="https://graad-sante.fr/app/uploads/2024/09/LOGO_GRAAD_SANTE_GOLD-1024x455.png"
            alt="Logo Graad Santé"
          >
        </div>

        <div class="header-topbar">
          <a
            href="./faq.html"
            class="header-link-button"
            target="_blank"
            rel="noopener noreferrer"
          >
            Mémo commercial
          </a>

          <a
            href="https://boisdrobin.github.io/Calculateur-indem-ANDPC/"
            class="header-link-button"
            target="_blank"
            rel="noopener noreferrer"
          >
            Calculateur ANDPC 2026
          </a>
        </div>

        <div class="header-inner">
          <p class="eyebrow">Catalogue interne</p>
          <h1>Catalogue des formations commercialisées</h1>
          <p class="subtitle" id="subtitle-text">
            Catalogue mis à jour à partir d’un export Notion
          </p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filters-panel">
      <div class="public-switcher-wrap">
        <div class="public-switcher-head">
          <h2 class="filters-block-title">Choisir un public</h2>
          <p class="filters-block-text">Sélectionnez un public pour filtrer rapidement le catalogue.</p>
        </div>

        <div class="public-switcher" role="group" aria-label="Choix du public">
          <button type="button" class="public-pill" data-public-value="">Tous</button>
          <button type="button" class="public-pill is-active" data-public-value="medecins">Médecins</button>
          <button type="button" class="public-pill" data-public-value="infirmiers">Infirmiers</button>
          <button type="button" class="public-pill" data-public-value="pharmaciens">Pharmaciens</button>
          <button type="button" class="public-pill" data-public-value="sages-femmes">Sages-femmes</button>
          <button type="button" class="public-pill" data-public-value="kines">Kinésithérapeutes</button>
          <button type="button" class="public-pill" data-public-value="dentistes">Dentistes</button>
        </div>
      </div>

      <section class="filters-block filters-block-secondary">
        <div class="filters-block-head">
          <h2 class="filters-block-title">Affiner les résultats</h2>
        </div>

        <div class="filters-grid filters-grid-secondary">
          <div class="filter-group filter-group-dependent">
            <label for="filter-specialty">Spécialité médicale</label>
            <select id="filter-specialty" disabled>
              <option value="">Aucune</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-format">Format</label>
            <select id="filter-format">
              <option value="">Tous</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-typologie">Typologie</label>
            <select id="filter-typologie">
              <option value="">Toutes</option>
            </select>
          </div>

          <div class="filter-group filter-search">
            <label for="search">Recherche</label>
            <div class="search-input-wrap">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input
                type="text"
                id="search"
                placeholder="Titre, dépôt, contexte..."
              >
            </div>
          </div>
        </div>
      </section>

      <div class="filters-actions">
        <button type="button" class="reset-filters-button" id="reset-filters">
          Réinitialiser les filtres
        </button>
      </div>
    </section>

    <section class="topbar">
      <p id="results-count">Chargement...</p>
    </section>

    <section id="results" class="cards"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
